<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gSB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="gPM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="gNX" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="600" rx="24" fill="#0A0E1A"/>
  <text x="40" y="50" font-family="'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="24" font-weight="800" fill="url(#head)">SB 品牌家族 · 方案 B</text>
  <text x="40" y="74" font-family="'Inter','PingFang SC',system-ui,sans-serif" font-size="13" fill="#64748B">同一六边形 · 换字母 · 配专属色</text>

  <!-- member panels -->
  <!-- SB -->
  <rect x="60" y="100" width="260" height="230" rx="16" fill="#111827" stroke="#1E293B"/>
  <g transform="translate(130,118) scale(0.6)">
    <polygon points="170,100 135,160.62 65,160.62 30,100 65,39.38 135,39.38" fill="url(#gSB)" stroke="url(#gSB)" stroke-width="18" stroke-linejoin="round"/>
    <text x="100" y="103" text-anchor="middle" dominant-baseline="central" font-family="'Inter',system-ui,sans-serif" font-size="62" font-weight="800" fill="#0A1124">SB</text>
  </g>
  <text x="190" y="270" text-anchor="middle" font-family="'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="20" font-weight="700" fill="#F1F5F9">赛博 · 母品牌</text>
  <text x="190" y="294" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#22D3EE">SB</text>
  <text x="190" y="314" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#64748B">#22D3EE → #3B82F6</text>

  <!-- PM -->
  <rect x="350" y="100" width="260" height="230" rx="16" fill="#111827" stroke="#1E293B"/>
  <g transform="translate(420,118) scale(0.6)">
    <polygon points="170,100 135,160.62 65,160.62 30,100 65,39.38 135,39.38" fill="url(#gPM)" stroke="url(#gPM)" stroke-width="18" stroke-linejoin="round"/>
    <text x="100" y="103" text-anchor="middle" dominant-baseline="central" font-family="'Inter',system-ui,sans-serif" font-size="62" font-weight="800" fill="#0A1124">PM</text>
  </g>
  <text x="480" y="270" text-anchor="middle" font-family="'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="20" font-weight="700" fill="#F1F5F9">项目管理系统</text>
  <text x="480" y="294" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#818CF8">SB.PM</text>
  <text x="480" y="314" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#64748B">#818CF8 → #6366F1</text>

  <!-- NX -->
  <rect x="640" y="100" width="260" height="230" rx="16" fill="#111827" stroke="#1E293B"/>
  <g transform="translate(710,118) scale(0.6)">
    <polygon points="170,100 135,160.62 65,160.62 30,100 65,39.38 135,39.38" fill="url(#gNX)" stroke="url(#gNX)" stroke-width="18" stroke-linejoin="round"/>
    <text x="100" y="103" text-anchor="middle" dominant-baseline="central" font-family="'Inter',system-ui,sans-serif" font-size="62" font-weight="800" fill="#0A1124">NX</text>
  </g>
  <text x="770" y="270" text-anchor="middle" font-family="'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="20" font-weight="700" fill="#F1F5F9">Nexus 中枢系统</text>
  <text x="770" y="294" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#2DD4BF">SB.NX</text>
  <text x="770" y="314" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#64748B">#2DD4BF → #0891B2</text>

  <!-- palette -->
  <text x="40" y="375" font-family="'Inter','PingFang SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="#CBD5E1">配色池（已用 + 预留）</text>
  <g font-family="'JetBrains Mono',monospace" font-size="11">
    <rect x="60" y="390" width="80" height="50" rx="9" fill="#3B82F6"/><text x="100" y="455" text-anchor="middle" fill="#94A3B8">SB</text>
    <rect x="152" y="390" width="80" height="50" rx="9" fill="#6366F1"/><text x="192" y="455" text-anchor="middle" fill="#94A3B8">PM</text>
    <rect x="244" y="390" width="80" height="50" rx="9" fill="#0891B2"/><text x="284" y="455" text-anchor="middle" fill="#94A3B8">NX</text>
    <rect x="360" y="390" width="80" height="50" rx="9" fill="#A855F7" opacity="0.85"/><text x="400" y="455" text-anchor="middle" fill="#475569">预留</text>
    <rect x="452" y="390" width="80" height="50" rx="9" fill="#0EA5E9" opacity="0.85"/><text x="492" y="455" text-anchor="middle" fill="#475569">预留</text>
    <rect x="544" y="390" width="80" height="50" rx="9" fill="#059669" opacity="0.85"/><text x="584" y="455" text-anchor="middle" fill="#475569">预留</text>
    <rect x="636" y="390" width="80" height="50" rx="9" fill="#F43F5E" opacity="0.85"/><text x="676" y="455" text-anchor="middle" fill="#475569">预留</text>
    <rect x="728" y="390" width="80" height="50" rx="9" fill="#F59E0B" opacity="0.85"/><text x="768" y="455" text-anchor="middle" fill="#475569">预留</text>
  </g>

  <!-- recipe -->
  <rect x="40" y="488" width="880" height="88" rx="14" fill="#0F172A" stroke="#1E293B"/>
  <text x="60" y="514" font-family="'Inter','PingFang SC',system-ui,sans-serif" font-size="14" font-weight="700" fill="#34D399">新建子项目配方</text>
  <text x="60" y="538" font-family="'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#CBD5E1">① 复制六边形标记 → ② 把字母换成项目 2 字母缩写 → ③ 从配色池挑一个未用的渐变 → ④ 命名 SB.XX</text>
  <text x="60" y="560" font-family="'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12.5" fill="#94A3B8">形状 / 字重 / 墨色字母 (#0A1124) 全部保持不变 —— 不变的部分就是「家族基因」。</text>
</svg>
