image: mcr.microsoft.com/dotnet/sdk:8.0

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

stages:
  - validate
  - build
  - test
  - package
  - publish

# ============ Stage 1: validate（规范检查） ============

lint:naming:
  stage: validate
  script:
    - echo "=== 检查命名空间合规 ==="
    - |
      if grep -rln --include="*.cs" "namespace SbPm\.\|namespace SB\.Pm\." SB.Framework.* 2>/dev/null; then
        echo "❌ 基座代码不允许 SbPm / SB.Pm 命名空间"
        exit 1
      fi
    - echo "=== 检查表前缀合规 ==="
    - |
      if grep -rln --include="*.cs" '\[Table(Name = "sb_pm_\|\[Table(Name = "sb_erp_' SB.Framework.* 2>/dev/null; then
        echo "❌ 基座代码不允许派生表前缀 sb_pm_* / sb_erp_*"
        exit 1
      fi
    - echo "=== 检查派生业务关键字 ==="
    - |
      FORBIDDEN="ProjectMilestone|RequirementComment|TaskItemLog|MindMapNode|FeatureModule|PipelineProfile"
      if grep -rE "class\s+($FORBIDDEN)" SB.Framework.* --include="*.cs" 2>/dev/null; then
        echo "❌ 基座代码出现派生业务关键字"
        exit 1
      fi
    - echo "✓ 命名规范检查通过"

# ============ Stage 2: build ============

build:
  stage: build
  script:
    - dotnet restore sb-framework.sln
    - dotnet build sb-framework.sln -c Release --no-restore
  artifacts:
    paths:
      - "**/bin/Release/"
    expire_in: 1 hour

# ============ Stage 3: test（占位 — 未来加测试工程时启用） ============

test:
  stage: test
  script:
    - echo "暂未配置测试工程"
    # - dotnet test sb-framework.sln -c Release --no-build

# ============ Stage 4: package（双包发布：默认带 License + NoLicense 中央服务器用） ============

package:
  stage: package
  script:
    # 第一遍：默认带 License（PackageId = SB.Framework.*）— 客户交付产品用
    - dotnet build sb-framework.sln -c Release
    - dotnet pack sb-framework.sln -c Release --no-build -o ./nupkgs
    # 第二遍：NoLicense（PackageId = SB.Framework.*.NoLicense，DisableLicense=true 排除 LicenseMiddleware 注册）
    # 中央服务器（sb-pm / 内部工具）用，不需要授权校验
    - dotnet build sb-framework.sln -c Release -p:DisableLicense=true
    - dotnet pack sb-framework.sln -c Release --no-build -o ./nupkgs -p:DisableLicense=true
    - ls -lh ./nupkgs/
  artifacts:
    paths:
      - "nupkgs/"
    expire_in: 1 week

# ============ Stage 5: publish（仅 tag 触发，自动推 NuGet 包） ============

publish:nuget:
  stage: publish
  dependencies:
    - package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
  script:
    # GitLab Group-level NuGet feed 只读，push 必须用 Project-level URL
    - dotnet nuget add source "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/nuget/index.json"
        --name gitlab
        --username gitlab-ci-token
        --password "$CI_JOB_TOKEN"
        --store-password-in-clear-text
    - for pkg in ./nupkgs/SB.Framework.*.nupkg; do
        dotnet nuget push "$pkg" --source gitlab --skip-duplicate;
      done

# 环境变量需在 GitLab 项目 Settings → CI/CD → Variables 配置:
# - SAIBO_FRAMEWORK_GROUP_ID = 63
